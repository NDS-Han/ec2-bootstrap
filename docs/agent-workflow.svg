<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 990" width="1200" height="990" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', 'Segoe UI', sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <style>
      .col{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.5}
      .colt{font-size:17px;font-weight:700;fill:#1f2328}
      .card{fill:#ffffff;stroke-width:2}
      .t{font-size:15px;font-weight:700;fill:#1f2328}
      .s{font-size:12.5px;fill:#57606a}
      .ln{fill:none;stroke:#57606a;stroke-width:1.8;marker-end:url(#ah)}
      .back{stroke-dasharray:6 4}
      .bt{font-size:12px;font-weight:700;fill:#ffffff;text-anchor:middle}
      .lg{font-size:13.5px;fill:#1f2328}
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="990" fill="#ffffff"/>
  <text x="600" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2328">에이전트 작업 흐름 · ec2-bootstrap + agent-work-kit</text>

  <!-- Columns -->
  <rect class="col" x="25" y="70" width="350" height="720" rx="14"/>
  <text class="colt" x="45" y="100">로컬 (Mac)</text>
  <rect class="col" x="395" y="70" width="475" height="720" rx="14"/>
  <text class="colt" x="415" y="100">EC2 개발 서버 (bootstrap.sh)</text>
  <rect class="col" x="890" y="70" width="285" height="720" rx="14"/>
  <text class="colt" x="910" y="100">저장소 · 배포 대상</text>

  <!-- Local -->
  <rect class="card" x="60" y="120" width="290" height="64" rx="10" stroke="#57606a"/>
  <text class="t" x="78" y="147">사용자</text>
  <text class="s" x="78" y="169">목표 제시 · 결정 · 지시문 붙여넣기</text>

  <rect class="card" x="60" y="220" width="290" height="64" rx="10" stroke="#8250df"/>
  <text class="t" x="78" y="247">claude.ai 대화 (오케스트레이터)</text>
  <text class="s" x="78" y="269">스펙 작성 · 진행 확인 · 요약 · 지시문</text>

  <rect class="card" x="60" y="320" width="290" height="64" rx="10" stroke="#8250df"/>
  <text class="t" x="78" y="347">Chrome + Claude in Chrome</text>
  <text class="s" x="78" y="369">Remote Control 탭을 대신 조작</text>

  <rect class="card" x="60" y="440" width="290" height="64" rx="10" stroke="#0969da"/>
  <text class="t" x="78" y="467">Devin IDE (SSH 원격)</text>
  <text class="s" x="78" y="489">머지 전 검토 · 머지 · 배포</text>

  <rect x="60" y="610" width="290" height="160" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="t" x="78" y="637">로컬 준비물</text>
  <text class="s" x="78" y="662">• Chrome + Claude in Chrome 확장</text>
  <text class="s" x="78" y="684">• claude.ai 계정 (Projects · 메모리)</text>
  <text class="s" x="78" y="706">• Devin IDE + EC2 SSH 원격 설정</text>
  <text class="s" x="78" y="728">• EC2 · GitHub용 SSH 키</text>
  <text class="s" x="78" y="750">• (선택) Claude 데스크톱 앱</text>

  <!-- EC2 -->
  <rect class="card" x="420" y="120" width="425" height="72" rx="10" stroke="#c2410c"/>
  <text class="t" x="438" y="147">tmux: claude-main · Claude Code (Remote Control)</text>
  <text class="s" x="438" y="170">디스패처 · SPEC 작성 · 요약 읽기</text>
  <text class="s" x="438" y="186">정밀 검토는 보안 · 비용 · 핫패스 작업만 (diff만)</text>

  <rect class="card" x="420" y="240" width="425" height="48" rx="10" stroke="#57606a"/>
  <text class="t" x="438" y="270">tmux: work-queue · 동시 실행 · 의존 순서</text>

  <rect class="card" x="420" y="320" width="205" height="76" rx="10" stroke="#0969da"/>
  <text class="t" x="436" y="346">devin-&lt;task&gt;</text>
  <text class="s" x="436" y="368">Devin CLI · swe-2.1-max</text>
  <text class="s" x="436" y="386">구현 (무료)</text>

  <rect class="card" x="640" y="320" width="205" height="76" rx="10" stroke="#8250df"/>
  <text class="t" x="656" y="346">kiro-&lt;task&gt;</text>
  <text class="s" x="656" y="368">Kiro · Opus 5.5 · effort high</text>
  <text class="s" x="656" y="386">교차 검토</text>

  <rect class="card" x="420" y="440" width="425" height="110" rx="10" stroke="#57606a"/>
  <text class="t" x="438" y="467">.agent-work/ (git 제외)</text>
  <text class="s" x="438" y="490">SPEC → REPORT · HANDOFF → DONE · SUMMARY</text>
  <text class="s" x="438" y="510">→ REVIEW_BY_CLAUDE · XREVIEW → DEPLOYED</text>
  <text class="s" x="438" y="532">wt/&lt;task&gt;: 작업별 worktree · 브랜치</text>

  <rect x="420" y="612" width="425" height="60" rx="10" fill="#fff1f0" stroke="#cf222e" stroke-width="1.5"/>
  <text class="t" x="438" y="638" fill="#cf222e">guard hook</text>
  <text class="s" x="438" y="660">push · merge · deploy · kubectl apply/delete · terraform 차단</text>

  <rect x="420" y="692" width="425" height="78" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="t" x="438" y="718">bootstrap.sh가 준비하는 것</text>
  <text class="s" x="438" y="741">tmux · Devin CLI · Kiro CLI · Claude Code · ~/agent-work-kit</text>
  <text class="s" x="438" y="760">로그인 3번은 직접 · 키트는 install.sh로 레포에 설치</text>

  <!-- Right -->
  <rect class="card" x="910" y="120" width="245" height="64" rx="10" stroke="#57606a"/>
  <text class="t" x="926" y="147">GitHub (origin)</text>
  <text class="s" x="926" y="169">작업 브랜치 → 기본 개발 브랜치</text>

  <rect class="card" x="910" y="440" width="245" height="64" rx="10" stroke="#1a7f37"/>
  <text class="t" x="926" y="467">dev 클러스터</text>
  <text class="s" x="926" y="489">배포 명령 (DEPLOY_CMD)</text>

  <rect x="910" y="612" width="245" height="64" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="t" x="926" y="639">prod (별도 계정)</text>
  <text class="s" x="926" y="661">런북으로 별도 진행</text>

  <!-- Arrows -->
  <path class="ln" d="M240,184 V218"/>
  <path class="ln back" d="M170,220 V186"/>
  <path class="ln" d="M205,284 V318"/>
  <path class="ln" d="M350,352 C385,352 385,156 418,156"/>
  <path class="ln back" d="M420,176 C385,176 390,252 352,252"/>
  <path class="ln" d="M632,192 V238"/>
  <path class="ln" d="M522,288 V318"/>
  <path class="ln" d="M742,288 V318"/>
  <path class="ln" d="M522,396 V438"/>
  <path class="ln" d="M742,396 V438"/>
  <path class="ln" d="M60,152 H40 V472 H58"/>
  <path class="ln" d="M205,504 V581 H1032 V506"/>
  <path class="ln" d="M1032,581 H1168 V152 H1157"/>
  <path class="ln" d="M632,581 V552"/>

  <!-- Step badges -->
  <g>
    <circle cx="256" cy="201" r="11" fill="#57606a"/><text class="bt" x="256" y="205">1</text>
    <circle cx="380" cy="300" r="11" fill="#8250df"/><text class="bt" x="380" y="304">2</text>
    <circle cx="648" cy="215" r="11" fill="#c2410c"/><text class="bt" x="648" y="219">3</text>
    <circle cx="538" cy="303" r="11" fill="#0969da"/><text class="bt" x="538" y="307">4</text>
    <circle cx="538" cy="418" r="11" fill="#57606a"/><text class="bt" x="538" y="422">5</text>
    <circle cx="398" cy="212" r="11" fill="#c2410c"/><text class="bt" x="398" y="216">6</text>
    <circle cx="154" cy="201" r="11" fill="#8250df"/><text class="bt" x="154" y="205">7</text>
    <circle cx="40" cy="310" r="11" fill="#57606a"/><text class="bt" x="40" y="314">8</text>
    <circle cx="780" cy="581" r="11" fill="#0969da"/><text class="bt" x="780" y="585">9</text>
  </g>

  <!-- Legend -->
  <rect x="25" y="810" width="1150" height="160" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text class="lg" x="50" y="842">① 사용자가 목표와 결정을 대화에 전달</text>
  <text class="lg" x="50" y="868">② 오케스트레이터가 Chrome 확장으로 EC2의 Claude Code에 지시</text>
  <text class="lg" x="50" y="894">③ Claude Code가 SPEC을 쓰고 work-queue에 작업을 배분</text>
  <text class="lg" x="50" y="920">④ Devin CLI가 구현, Kiro는 교차 검토 (작업별 worktree · 브랜치)</text>
  <text class="lg" x="50" y="946">⑤ 결과는 .agent-work 파일로 남음: REPORT · HANDOFF · DONE · SUMMARY</text>
  <text class="lg" x="615" y="842">⑥ Claude Code가 요약을 읽고, 보안·비용·핫패스 작업만 diff 검토</text>
  <text class="lg" x="615" y="868">⑦ 오케스트레이터가 한국어 요약과 Devin IDE 지시문을 전달</text>
  <text class="lg" x="615" y="894">⑧ 사용자가 Devin IDE에 지시문을 붙여넣음</text>
  <text class="lg" x="615" y="920">⑨ Devin IDE가 검토 → 머지 → dev 배포 → DEPLOYED.md 기록</text>
  <text class="lg" x="615" y="946" fill="#cf222e">EC2의 에이전트는 push · merge · 배포를 하지 않음</text>
</svg>
